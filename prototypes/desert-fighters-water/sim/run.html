<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Balance Sim</title>
<style>
  body { margin: 0; padding: 16px; background: #1f140c; color: #e8d3b0; font: 12px/1.45 ui-monospace, Consolas, monospace; }
  pre { white-space: pre; overflow-x: auto; }
  .hint { color: #c9a97f; margin-bottom: 8px; }
</style>
</head>
<body>
<!-- Runs sim.mjs in the browser (there is no Node runner).
     Pass the same flags as the CLI in ?args=, e.g. run.html?args=--pool base --games 6000 --tiles random -->
<div class="hint" id="hint">Running…</div>
<pre id="out"></pre>
<script type="module">
  const args = (new URLSearchParams(location.search).get('args') || '').split(/\s+/).filter(Boolean);
  globalThis.process = { argv: ['node', 'sim.mjs', ...args] };
  const out = document.getElementById('out');
  const log = console.log.bind(console);
  console.log = (...a) => { out.textContent += a.join(' ') + '\n'; log(...a); };
  document.getElementById('hint').textContent = `node sim/sim.mjs ${args.join(' ')}`;
  try {
    await import('./sim.mjs');
    document.body.dataset.done = '1';
  } catch (err) {
    out.textContent += `\nERROR: ${err.stack || err}`;
    document.body.dataset.done = 'error';
  }
</script>
</body>
</html>
