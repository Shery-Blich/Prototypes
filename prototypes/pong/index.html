<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Pong Prototype</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="pong-wrap">
    <div class="scoreboard">
      <span class="score-player" id="player-score">0</span>
      <span style="color: #475569;">:</span>
      <span class="score-ai" id="ai-score">0</span>
    </div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div class="hints">Move: W/S or ↑/↓ • First to 7 wins</div>
  </div>

  <script type="module" src="/src/shared/nav.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
